name: Deploy benchmarks

on:
  workflow_run:
    workflows:
      - "CMake on multiple platforms"
    types:
      - completed

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Download a build
        uses: actions/download-artifact@v6
        with:
          name: ubuntu-latest-build

      - name: Install UV
        run: |
          curl -LsSf https://astral.sh/uv/install.sh | sh

      - name: Run benchmarks
        run: |
          cd {{ github.workspace }}/bench
          uv run main.py

      - name: Generate HTML
        run: |
          cd {{ github.workspace }}
          mkdir -p public

          cat > public/index.html <<'EOF'
          <!DOCTYPE html>
          <html lang="en">
          <head>
            <meta charset="UTF-8">
            <meta name="viewport" content="width=device-width, initial-scale=1.0">
            <title>HWC benchmarks</title>
            <style>
              * {
                box-sizing: border-box;
              }

              body {
                margin: 0;
                padding: 40px 20px;
                font-family: system-ui, -apple-system, sans-serif;
                background: #f7f7f7;
                color: #222;
              }

              main {
                max-width: 1200px;
                margin: 0 auto;
                text-align: center;
              }

              h1 {
                margin: 0 0 40px;
                font-size: 32px;
                font-weight: 600;
              }

              .images {
                display: grid;
                grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
                gap: 24px;
              }

              .image {
                background: white;
                padding: 12px;
                border-radius: 8px;
                box-shadow: 0 1px 4px rgba(0, 0, 0, 0.08);
              }

              img {
                display: block;
                width: 100%;
                height: auto;
                border-radius: 4px;
              }
            </style>
          </head>

          <body>
            <main>
              <h1>HWNC benchmarks</h1>
              <div class="images">
          EOF

          find bench/data -type -iname '*.png' -o | sort | \
            while read -r image; do
              echo "        <div class=\"image\">"
              echo "          <img src=\"$image\" alt=\"Benchmark\">"
              echo "        </div>"
            done

          cat >> public/index.html <<'EOF'
              </div>
            </main>
          </body>
          </html>
          EOF

          cp -r images public/

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: public

      - name: Deploy to GitHub Pages
        uses: actions/deploy-pages@v5
